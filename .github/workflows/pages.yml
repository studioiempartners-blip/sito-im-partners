# Pubblica il sito statico su GitHub Pages a ogni push su main
name: Pubblica sito

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepara i file da pubblicare (senza sorgenti e configurazioni)
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_sorgenti' \
            --exclude 'README.md' --exclude 'netlify.toml' --exclude '_site' ./ _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
